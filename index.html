<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>HTML5_TEST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #MMFCanvas {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      display: block;
      margin: auto;
    }

    #bloctxt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>

  <script>
    // Vanhojen selainten tarkistus
    if (!document.createElement("canvas").getContext) {
      window.location.href = "http://www.clickteam.com/html5-fallback";
    }
  </script>

  <script src="src/Runtime.js"></script>
</head>

<body>

  <canvas id="MMFCanvas" width="1920" height="1080">
    Your browser does not support Canvas.
  </canvas>

  <script>
    // file:// -protokollan varoitus ilman document.writeä
    if (window.location.protocol === "file:") {
      const errorBox = document.createElement("div");
      errorBox.id = "bloctxt";
      errorBox.innerHTML = `
        <h2>The application cannot be run locally</h2>
        <p>HTML browsers do not allow launching data files directly from the file system.<br>
        Please use a local web server (or the Build & Run option) to test your application.</p>
      `;
      document.body.innerHTML = "";
      document.body.appendChild(errorBox);
      throw new Error("Cannot run application over file:// protocol");
    }

    // Käynnistetään peli, kun sivu on latautunut
    window.addEventListener("load", () => {
      new Runtime("MMFCanvas", "resources/HTML5_TEST.cch");
    });
  </script>

</body>
</html>
